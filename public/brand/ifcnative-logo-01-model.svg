<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">IFCnative – Logo Variante Modell</title>
  <desc id="desc">Isometrisches Gebäudemodell mit hervorgehobener, editierbarer Fläche und Wortmarke IFCnative.</desc>
  <defs>
    <linearGradient id="model-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8BE5D7"/>
      <stop offset="1" stop-color="#48BCAE"/>
    </linearGradient>
    <linearGradient id="model-side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#267F79"/>
      <stop offset="1" stop-color="#14524F"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
      <feOffset in="blur" dy="8" result="offset"/>
      <feFlood flood-color="#102D30" flood-opacity=".16" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow-layer"/>
      <feMerge><feMergeNode in="shadow-layer"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(22 18)" filter="url(#shadow)">
    <rect width="184" height="184" rx="42" fill="#EAF8F5"/>
    <path d="M92 31 151 64 92 98 33 64Z" fill="url(#model-top)"/>
    <path d="m33 64 59 34v68l-59-34Z" fill="#1F6B67"/>
    <path d="m92 98 59-34v68l-59 34Z" fill="url(#model-side)"/>
    <path d="M92 31v67m-59-34 59 34 59-34M92 98v68" fill="none" stroke="#D9FFFA" stroke-width="4" stroke-linejoin="round" opacity=".84"/>
    <path d="m33 98 59 34 59-34" fill="none" stroke="#D9FFFA" stroke-width="3" opacity=".48"/>
    <path d="m117 84 34-20v34l-34 20Z" fill="#FFB703"/>
    <circle cx="117" cy="84" r="5.5" fill="#FFF8DB" stroke="#8C6100" stroke-width="2"/>
    <circle cx="151" cy="64" r="5.5" fill="#FFF8DB" stroke="#8C6100" stroke-width="2"/>
    <circle cx="151" cy="98" r="5.5" fill="#FFF8DB" stroke="#8C6100" stroke-width="2"/>
    <circle cx="117" cy="118" r="5.5" fill="#FFF8DB" stroke="#8C6100" stroke-width="2"/>
  </g>

  <g transform="translate(246 58)">
    <text x="0" y="64" fill="#17383A" font-family="Geist, Inter, Segoe UI, Arial, sans-serif" font-size="76" font-weight="720" letter-spacing="-4">IFC</text>
    <text x="124" y="64" fill="#247D76" font-family="Geist, Inter, Segoe UI, Arial, sans-serif" font-size="76" font-weight="460" letter-spacing="-4">native</text>
    <path d="M3 87h392" stroke="#C8DBD8" stroke-width="2"/>
    <text x="3" y="116" fill="#507174" font-family="Geist Mono, Consolas, monospace" font-size="17" font-weight="600" letter-spacing="5.5">IFC EDITOR</text>
  </g>
</svg>
