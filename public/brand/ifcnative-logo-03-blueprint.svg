<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">IFCnative – Logo Variante Blueprint</title>
  <desc id="desc">Technisches Grundriss-Signet mit Auswahlrahmen und präziser IFCnative-Wortmarke.</desc>
  <defs>
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0v12" fill="none" stroke="#20736E" stroke-width="1" opacity=".13"/>
    </pattern>
    <filter id="plan-shadow" x="-30%" y="-30%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dy="7" result="offset"/>
      <feFlood flood-color="#12383B" flood-opacity=".14" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow-layer"/>
      <feMerge><feMergeNode in="shadow-layer"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(22 18)" filter="url(#plan-shadow)">
    <rect width="184" height="184" rx="36" fill="#F3FAF9"/>
    <rect width="184" height="184" rx="36" fill="url(#grid)"/>
    <path d="M42 42h44v14H56v30H42Zm56 0h44v44h-14V56H98Zm44 56v44H98v-14h30V98Zm-56 44H42V98h14v30h30Z" fill="#1B6E69"/>
    <path d="M73 73h38v38H73Z" fill="none" stroke="#4BB8AA" stroke-width="8"/>
    <path d="M92 73v38M73 92h38" stroke="#4BB8AA" stroke-width="4"/>
    <path d="m118 119 31 14-13 6-7 15Z" fill="#FFB703" stroke="#754E00" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <g transform="translate(244 48)">
    <text x="0" y="67" fill="#183A3C" font-family="Geist, Inter, Segoe UI, Arial, sans-serif" font-size="74" font-weight="760" letter-spacing="-3.8">IFC</text>
    <text x="126" y="67" fill="#183A3C" font-family="Geist, Inter, Segoe UI, Arial, sans-serif" font-size="74" font-weight="430" letter-spacing="-3.8">native</text>
    <g transform="translate(3 91)">
      <rect width="142" height="30" rx="15" fill="#DDF3EF"/>
      <circle cx="16" cy="15" r="5" fill="#279287"/>
      <text x="30" y="20.5" fill="#24615F" font-family="Geist Mono, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="2.6">IFC EDITOR</text>
      <path d="M161 15h230" stroke="#9DB9B7" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round"/>
      <circle cx="391" cy="15" r="4" fill="#FFB703"/>
    </g>
  </g>
</svg>
