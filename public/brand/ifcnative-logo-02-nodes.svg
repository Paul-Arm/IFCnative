<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">IFCnative – Logo Variante Knoten</title>
  <desc id="desc">Kompaktes App-Signet aus verbundenen Modellknoten, IFC-Monogramm und Editor-Kennung.</desc>
  <defs>
    <linearGradient id="badge" x1="78" y1="64" x2="560" y2="586" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B5555"/>
      <stop offset="1" stop-color="#0B262B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(466 132) rotate(135) scale(360)">
      <stop stop-color="#52D8C4" stop-opacity=".26"/>
      <stop offset="1" stop-color="#52D8C4" stop-opacity="0"/>
    </radialGradient>
    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur"/>
      <feOffset in="blur" dy="18" result="offset"/>
      <feFlood flood-color="#061C20" flood-opacity=".3" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow-layer"/>
      <feMerge><feMergeNode in="shadow-layer"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#badge-shadow)">
    <rect x="52" y="42" width="536" height="536" rx="126" fill="url(#badge)"/>
    <rect x="52" y="42" width="536" height="536" rx="126" fill="url(#glow)"/>
    <rect x="62" y="52" width="516" height="516" rx="116" fill="none" stroke="#8BE5D7" stroke-opacity=".16" stroke-width="2"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M168 210 320 123l152 87v174l-152 87-152-87Z" stroke="#85DFD2" stroke-width="10" opacity=".34"/>
    <path d="m168 210 152 88 152-88M320 123v175m0 0v173" stroke="#85DFD2" stroke-width="8" opacity=".22"/>
    <path d="m168 384 152-86 152 86" stroke="#85DFD2" stroke-width="8" opacity=".18"/>
  </g>

  <g fill="#C8FFF6" stroke="#123C3E" stroke-width="7">
    <circle cx="168" cy="210" r="15"/>
    <circle cx="320" cy="123" r="15"/>
    <circle cx="472" cy="210" r="15"/>
    <circle cx="168" cy="384" r="15"/>
    <circle cx="320" cy="471" r="15"/>
    <circle cx="472" cy="384" r="15"/>
  </g>
  <circle cx="472" cy="384" r="19" fill="#FFB703" stroke="#FFF1B8" stroke-width="7"/>

  <g fill="#F5FFFD">
    <path d="M211 230h33v138h-33Z"/>
    <path d="M265 230h94v29h-61v30h53v28h-53v51h-33Z"/>
    <path d="M429 269c-12-9-23-13-36-13-24 0-38 17-38 43s14 43 39 43c14 0 26-5 37-14v31c-12 8-27 12-44 12-41 0-68-28-68-72 0-43 29-72 69-72 17 0 30 4 41 11Z"/>
  </g>

  <text x="320" y="529" text-anchor="middle" fill="#A9C9C6" font-family="Geist Mono, Consolas, monospace" font-size="18" font-weight="650" letter-spacing="7">NATIVE EDITOR</text>
</svg>
