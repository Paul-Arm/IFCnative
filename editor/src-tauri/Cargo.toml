[package]
name = "ifcnative"
version = "1.4.16"
description = "Desktop IFC builder and viewer"
authors = ["MKP"]
edition = "2021"

[lib]
name = "ifcnative_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
dotenvy = "0.15"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tempfile = "3"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "system-proxy"] }
regex = "1"
sentry = { version = "0.49", default-features = false, features = ["metrics"] }
