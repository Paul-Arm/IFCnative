# Ergänzt das offizielle OpenProject-Compose (github.com/opf/openproject-
# docker-compose, Branch stable/17) um das Plugin "IFC Hub":
#
#   - web, worker, cron und seeder laufen mit dem eigenen Image
#     (gebaut mit deploy/openproject-server/build-image.ps1),
#   - das Plugin bekommt Hub-Adresse, gemeinsames Secret und die
#     SSRF-Freigabe für die IP des Hubs.
#
# Neben die docker-compose.yml des Setups legen — docker compose liest eine
# docker-compose.override.yml automatisch mit. Werte kommen aus der .env
# daneben (Vorlage: .env.example in diesem Ordner).
#
# Zurück zum Original-Image: Datei entfernen (oder umbenennen) und
# `docker compose up -d`. Die Tabelle des Plugins bleibt in der Datenbank
# und stört OpenProject nicht.

x-ifc-hub-image: &ifc_hub_image
  image: ${IFC_HUB_OPENPROJECT_IMAGE:?IFC_HUB_OPENPROJECT_IMAGE in .env setzen}
  # never: per "docker load" übertragenes Image, "docker compose pull"
  # überspringt diese Dienste. missing/always: Image aus einer Registry.
  pull_policy: ${IFC_HUB_PULL_POLICY:-never}

# Hub-Hostname ohne DNS auf dem OpenProject-Server (z. B. *.dokploy.local
# hinter Traefik): fester Hosts-Eintrag in den Containern. Ohne Angaben
# ein wirkungsloser Platzhalter.
x-ifc-hub-hosts: &ifc_hub_hosts
  extra_hosts:
    - "${IFC_HUB_HOSTNAME:-ifc-hub.invalid}:${IFC_HUB_HOST_IP:-127.0.0.1}"

x-ifc-hub-env: &ifc_hub_env
  # Adresse des Hubs, wie der BROWSER sie öffnet (Einbettung, Links).
  IFC_HUB_URL: ${IFC_HUB_URL:?IFC_HUB_URL in .env setzen}
  # Gemeinsames Secret mit dem Hub (dort OPENPROJECT_SHARED_SECRET), >= 32 Zeichen.
  IFC_HUB_SHARED_SECRET: ${IFC_HUB_SHARED_SECRET:?IFC_HUB_SHARED_SECRET in .env setzen}
  # OpenProject blockiert Server-Anfragen an private IPs (SSRF-Schutz).
  # Speicher "IFC Hub" und Abgleich rufen den Hub auf — seine IP freigeben.
  OPENPROJECT_SSRF_PROTECTION_IP_ALLOWLIST: ${IFC_HUB_SSRF_ALLOWLIST:?IFC_HUB_SSRF_ALLOWLIST in .env setzen}

services:
  web:
    <<: [*ifc_hub_image, *ifc_hub_hosts]
    environment: *ifc_hub_env
  # Abgleich-Jobs (GoodJob, inkl. 5-Minuten-Cron) laufen im Worker.
  worker:
    <<: [*ifc_hub_image, *ifc_hub_hosts]
    environment: *ifc_hub_env
  cron:
    <<: [*ifc_hub_image, *ifc_hub_hosts]
    environment: *ifc_hub_env
  # Führt beim Start die Migrationen aus, auch die des Plugins.
  seeder:
    <<: [*ifc_hub_image, *ifc_hub_hosts]
    environment: *ifc_hub_env
