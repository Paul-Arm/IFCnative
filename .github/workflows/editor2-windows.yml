name: Editor 2.0 Windows-Build

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths: ["editor-2.0/app/**"]
  pull_request:
    paths: ["editor-2.0/app/**"]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: editor-2.0/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor-2.0/app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: editor-2.0/app/src-tauri

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests
        run: npm test

      - name: Tauri-Build (NSIS-Installer, unsigniert — E12)
        run: npm run tauri build

      - name: Installer als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: ifcnative-editor-2.0-windows
          path: |
            editor-2.0/app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
