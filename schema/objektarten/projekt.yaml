# Diagnostik-Projekt: kein Element, sondern das Pset Projekt am IfcBuilding.
objektart: Projekt
entity: { pset: Projekt, am: Bauwerk }
kardinalitaet: { proDatei: { min: 1, max: 1 } }

id:
  merkmal: Projekt.ID
  grammatik: PROJEKT
  eindeutig: { scope: portal }
  # Portal prüft die Grammatik NICHT, nur Eindeutigkeit — für uns Konvention
  herleitungPruefung: { stufe: warnung, befund: editor_id_prefix_mismatch }

phasen:
  planung: &alle
    psets:
      Projekt: { pflicht: [ID, Bezeichnung] }
  einzelergebnisse: *alle
  ergebnisse:
    <<: *alle
    # Projekt muss aus Planung oder Einzelergebnissen bereits im Portal existieren
    referenz:
      {
        Projekt.ID:
          { ziel: Projekt, quelle: portal, befund: unknown_reference },
      }
